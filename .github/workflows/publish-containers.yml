name: Publish containers

on:
  push:
    branches: [main]
  # Pushes made with GITHUB_TOKEN do not trigger `push` workflows, so lock
  # updates are picked up here instead.
  workflow_run:
    workflows: ["Update flake.lock"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers
  cancel-in-progress: true

jobs:
  list:
    # only run if this is the triggering workflow was successful, or it was triggered by something else
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.list.outputs.containers }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: List container configurations
        id: list
        run: |
          containers=$(nix eval --json .#nixosContainerConfigurations --apply builtins.attrNames)
          echo "containers=$containers" >> "$GITHUB_OUTPUT"

  publish:
    needs: list
    if: needs.list.outputs.containers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJSON(needs.list.outputs.containers) }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: nix build ".#${{ matrix.container }}-image" --print-build-logs

      - name: Push to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.container }}"
          skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          skopeo copy "docker-archive:$(readlink -f result)" "docker://$image:$GITHUB_SHA"
          skopeo copy "docker://$image:$GITHUB_SHA" "docker://$image:latest"
